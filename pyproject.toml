[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaexp"
version = "0.3.0"
description = "Plataforma de experimentação do beOn Labs orientada por agentes (Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ingestao = ["python-docx>=1.1"]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.scripts]
metaexp = "metaexp.cli:main"

[tool.setuptools.packages.find]
include = ["metaexp*"]

[tool.setuptools.package-data]
metaexp = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
