<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>METAEXP Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell com trilho de navegação à esquerda (vira faixa horizontal no celular), barra superior com persona e roteiro de teste. */
:root {
  --bg: #FAF7F6; --surface: #FFFFFF; --surface-2: #F3EDEC; --line: #E6DCDA; --line-strong: #D3C6C3;
  --fg: #1E1615; --muted: #6C5F5D; --faint: #9A8C8A;
  --accent: #D2281C; --accent-ink: #FFFFFF; --accent-soft: #FBE5E2; --accent-line: #F2BDB7;
  --ok: #1D7F4F; --ok-soft: #E2F3EA; --warn: #A86A0C; --warn-soft: #FBF0DC;
  --bad: #A6261A; --bad-soft: #F9E1DE; --info: #2858B8; --info-soft: #E3ECFB;
  --code-bg: #1F1918; --code-fg: #F1E9E7; --code-key: #FF9B8F; --code-cmt: #9A8C8A; --code-hl: #3A2A27;
  --shadow: 0 1px 2px rgba(60,20,15,.06), 0 8px 24px rgba(60,20,15,.06);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161112; --surface: #1F191A; --surface-2: #2A2223; --line: #362D2D; --line-strong: #4A3E3D;
  --fg: #F3ECEA; --muted: #B3A5A2; --faint: #857775;
  --accent: #FF5B4C; --accent-ink: #1A0D0B; --accent-soft: #3A1D1A; --accent-line: #6B2C25;
  --ok: #52C98F; --ok-soft: #14301F; --warn: #E8B353; --warn-soft: #33280F;
  --bad: #FF7D6E; --bad-soft: #3B1A16; --info: #7DB1FF; --info-soft: #16243B;
  --code-bg: #0F0B0B; --code-fg: #F1E9E7; --code-key: #FF9B8F; --code-cmt: #857775; --code-hl: #33221F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161112; --surface: #1F191A; --surface-2: #2A2223; --line: #362D2D; --line-strong: #4A3E3D;
  --fg: #F3ECEA; --muted: #B3A5A2; --faint: #857775;
  --accent: #FF5B4C; --accent-ink: #1A0D0B; --accent-soft: #3A1D1A; --accent-line: #6B2C25;
  --ok: #52C98F; --ok-soft: #14301F; --warn: #E8B353; --warn-soft: #33280F;
  --bad: #FF7D6E; --bad-soft: #3B1A16; --info: #7DB1FF; --info-soft: #16243B;
  --code-bg: #0F0B0B; --code-fg: #F1E9E7; --code-key: #FF9B8F; --code-cmt: #857775; --code-hl: #33221F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; line-height: 1.15; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: 12.5px; }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .02em; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; }
.brand-sub { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); padding: 10px 10px 4px; font-weight: 600; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 11px; background: var(--surface-2); color: var(--muted); padding: 0 7px; border-radius: 99px; }
.nav button.on .count { background: var(--accent); color: var(--accent-ink); }
.rail-foot { margin-top: auto; font-size: 11px; color: var(--faint); padding: 0 10px; }

.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 28px; flex-wrap: wrap; }
.crumbs { font-size: 12.5px; color: var(--muted); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--fg); font-weight: 600; }
.persona { display: flex; align-items: center; gap: 8px; }
.persona select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--fg); flex: none; font-family: var(--f-display); }
main { padding: 24px 28px 64px; max-width: 1240px; width: 100%; display: flex; flex-direction: column; gap: 20px; }

/* Building blocks */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.lg { padding: 11px 18px; font-size: 14.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h p { color: var(--muted); font-size: 12.5px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h .lead { color: var(--muted); max-width: 64ch; margin-top: 6px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.run { background: var(--info-soft); color: var(--info); }
.pill.run::before { animation: pulse 1.2s infinite; }
.pill.plain::before { display: none; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.gate { display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 11px; width: 30px; height: 22px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); flex: none; }
.gate.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.gate.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.gate.idle { background: var(--surface-2); color: var(--faint); border-color: var(--line); }
@keyframes pulse { 50% { opacity: .3; } }

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: 12px; color: var(--muted); }
.kpi .val { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .meta { font-size: 11.5px; color: var(--muted); }
.kpi .meta b { color: var(--ok); font-weight: 600; }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surface-2); }
.t .num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }

.exp-id { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.exp-title { font-weight: 600; }

/* Pipeline stepper */
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
.step .n { font-family: var(--f-mono); font-size: 11px; color: var(--faint); display: flex; justify-content: space-between; align-items: center; }
.step .nm { font-weight: 600; font-size: 13px; }
.step .ag { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.done { background: var(--ok-soft); border-color: transparent; }
.step.done .n { color: var(--ok); }
.step.cur { border-color: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
.step.blocked { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.step.wait { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }

/* Journey stepper (top of journey pages) */
.journey { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.journey span { padding: 4px 10px; border-radius: 99px; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.journey span.done { color: var(--ok); background: var(--ok-soft); }
.journey span.cur { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
.journey i { color: var(--faint); font-style: normal; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 12px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 92%; }
.msg .bubble { background: var(--surface-2); padding: 10px 13px; border-radius: 4px 12px 12px 12px; min-width: 0; }
.msg.me { margin-left: auto; flex-direction: row-reverse; }
.msg.me .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 12px 4px 12px 12px; }
.msg .who { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.msg.me .who { display: none; }
.agent-av { background: var(--fg); color: var(--bg); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--accent-line); background: var(--surface); color: var(--fg); padding: 8px 12px; border-radius: 99px; cursor: pointer; font-size: 13px; text-align: left; }
.chip:hover { background: var(--accent-soft); border-color: var(--accent); }
.ref { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; margin-top: 8px; background: var(--surface); color: var(--fg); }

/* Code */
pre.code { background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 12.5px; line-height: 1.65; padding: 14px 16px; border-radius: 8px; margin: 0; overflow-x: auto; white-space: pre; }
pre.code .k { color: var(--code-key); }
pre.code .c { color: var(--code-cmt); }
pre.code .hl { background: var(--code-hl); display: inline-block; width: 100%; animation: flash 1.2s ease-out; }
pre.code .empty { color: var(--code-cmt); font-style: italic; }
@keyframes flash { from { background: var(--accent); } }
.log { background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 12px; line-height: 1.7; padding: 12px 14px; border-radius: 8px; height: 260px; overflow-y: auto; }
.log .t { color: var(--code-cmt); margin-right: 8px; }
.log .a { color: var(--code-key); margin-right: 6px; }
.log .okl { color: #6FD3A0; } .log .badl { color: #FF8C7E; } .log .warnl { color: #F0C060; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13px; }
.field .hint { font-size: 12px; color: var(--muted); }
textarea, input[type=text], select.in { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 10px 12px; width: 100%; }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 2px; }
.opt:hover { border-color: var(--line-strong); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font-size: 13px; }
.opt span { font-size: 12px; color: var(--muted); }

/* G0 */
.dim { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.dim:first-child { border-top: 0; padding-top: 0; }
.dim-ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); }
.dim-ic.ok { background: var(--ok-soft); color: var(--ok); }
.dim-ic.warn { background: var(--warn-soft); color: var(--warn); }
.dim-ic.bad { background: var(--bad-soft); color: var(--bad); }
.dim-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.checks { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.checks li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.checks li.pend::before { content: "○ "; color: var(--warn); }
.decision { border-radius: var(--r); padding: 16px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.decision.ok { background: var(--ok-soft); }
.decision.warn { background: var(--warn-soft); }
.decision.bad { background: var(--bad-soft); }
.decision .dt { font-family: var(--f-display); font-weight: 700; font-size: 15px; }

/* Agents */
.agents { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.agent { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; gap: 8px; align-items: center; min-width: 0; background: var(--surface); }
.agent.active { border-color: var(--info); background: var(--info-soft); }
.agent.done { opacity: .7; }
.agent .nm { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .st { font-size: 11px; color: var(--muted); }

/* Formula */
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 4px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; }
.kcard:hover { border-color: var(--line-strong); }
.kcard .exp-title { font-size: 12.5px; line-height: 1.35; }

/* Events */
.events { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.events li { display: grid; grid-template-columns: 74px 36px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.events li:first-child { border-top: 0; }
.events .ts { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); padding-top: 2px; }
.events .new { animation: flash-row 2s ease-out; }
@keyframes flash-row { from { background: var(--accent-soft); } }

/* Rubric */
.rubric { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.scale { display: flex; gap: 4px; }
.scale button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; }
.scale button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Drawer + toast */
.drawer-bg { position: fixed; inset: 0; background: rgba(20,10,8,.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); z-index: 41; border-left: 1px solid var(--line); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; box-shadow: var(--shadow); }
.tour-step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.tour-step .ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.tour-step.done .ck { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tour-step b { font-size: 13.5px; }
.tour-step p { font-size: 12px; color: var(--muted); }
.toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100% - 32px)); pointer-events: none; }

function L(ag, txt, cls) { return { log: { ag, txt, cls } }; }
function buildSteps(sc) {

  if (sc === 'g1') { s.push(L('dados', 'incidentes rotulados disponíveis: 214 (janela de 90 dias)', 'badl'), { g1: { n: 385, disp: 214, miss: 3.1, ok: false } }, { block: 'g1' }); return s; }
  s.push(...afterG1(412));

function afterG1(disp) {
  const s = [L('dados', `incidentes rotulados disponíveis: ${disp} · acima do mínimo`, 'okl'), { g1: { n: 385, disp, miss: 3.1, ok: true } }, L('dados', 'G1 aprovado · eda_report.md e data_card.md publicados', 'okl'), { art: 'eda' }];
  s.push({ phase: 2 }, L('dev', 'pattern correlacao-eventos/agrupamento-temporal v1.2 recuperado'), L('dev', 'plano.md: janela temporal de 300 s + vizinhança topológica'), { art: 'plano' });
  s.push({ phase: 3 }, L('dev', 'sandbox exp-voc-corr-02 provisionado · dependências instaladas'), L('dev', 'scripts/ingestao.py · scripts/agrupamento.py · scripts/causa_raiz.py gerados'), { art: 'scripts' });
  s.push({ phase: 4 }, L('qa', 'tests/test_outputs.py · tests/test_spec.py · 9 critérios da ficha'), { art: 'tests' });
  return s;
}
function ralphSteps(list, fromIdx) {
  const s = [];
  list.slice(fromIdx).forEach(it => {
    s.push(L('qa', `k=${it.k} · ${it.falha} · Qk = ${fmt(it.q)}`, it.q >= 0.85 ? 'okl' : 'warnl'));
    s.push({ iter: it });
    if (it.fb !== '—' && !(S.run.scenario === 'kmax' && it.k === 5)) s.push(L('dev', `feedback aplicado: ${it.fb}`));
  });

}
function finishSteps(kstar) {
  return [
    { phase: 5 }, L('qa', 'aderência à spec: 9/9 critérios · outputs não vazios · exit code 0'), L('qa', `G2 aprovado em k* = ${kstar} · qa_report.json publicado`, 'okl'), { art: 'qa' },
    { phase: 6 }, L('analista', 'comparando resultados com hipótese e critérios da ficha'), L('analista', 'redução de volume 46% (meta 40%) · recall 92% (meta 90%) · precisão causa raiz 64% (meta 70%, opcional)'),
    L('analista', 'veredito: hipótese validada nos critérios obrigatórios', 'okl'), { art: 'parecer' }, { done: true },

function startRun() {
  const R = S.run;
  Object.assign(R, { status: 'running', steps: buildSteps(R.scenario), ptr: 0, phase: -1, logs: [], iters: [], g1: null, block: null, done: [], arts: {} });
  if (R.scenario !== 'g1') R.steps.push(...ralphSteps(R.scenario === 'kmax' ? RALPH_KMAX : RALPH_NOMINAL, 0), ...(R.scenario === 'kmax' ? [{ block: 'kmax' }] : finishSteps(4)));

function scenarioName(s) { return { nominal: 'nominal', g1: 'dados insuficientes no G1', kmax: 'Ralph Loop atinge Kmax' }[s]; }
function tick() {

const VIEWS = { home: vHome, nova: vNova, ficha: vFicha, g0: vG0, exec: vExec, parecer: vParecer, catalogo: vCatalogo, patterns: vPatterns, governanca: vGovernanca, revisao: vRevisao, sponsor: vSponsor, detalhe: vDetalhe };
function render() {
  if (S.view === 'governanca') tourDone('gov');
  const m = document.getElementById('main');
  const logEl = document.getElementById('log'); const wasBottom = !logEl || logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
  m.innerHTML = (VIEWS[S.view] || vHome)();
  renderNav(); renderDrawer(); updateTourCount();
  const nl = document.getElementById('log'); if (nl && wasBottom) nl.scrollTop = nl.scrollHeight;
  scrollChat();

document.addEventListener('input', e => { if (e.target.id === 'ideaText') S.idea.texto = e.target.value; });
document.getElementById('persona').addEventListener('change', e => { S.persona = e.target.value; toast('Agora você está como ' + PERSONAS[S.persona].nome + ' · ' + PERSONAS[S.persona].area); go(PERSONAS[S.persona].home); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-a],[data-exp],[data-dom],[data-gp],[data-chip],[data-skill],[data-sc],[data-dec],[data-startgp],[data-score],[data-sp],[data-tourgo]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.tourgo) { S.drawer = false; return go(d.tourgo); }
  if (d.exp) {
    if (S.j && d.exp === S.j.id) { const map = { ficha: 'ficha', g0: 'g0', exec: 'exec', parecer: 'parecer', concluido: S.run.status === 'done' ? 'parecer' : 'exec' }; return go(map[S.j.stage]); }
    return go('detalhe', { detail: d.exp });
  }
  if (d.dom) { S.idea.dominio = d.dom; return render(); }
  if (d.gp) { S.idea.gp = d.gp; return render(); }
  if (d.startgp) { S.idea.gp = d.startgp; S.idea.dominio = GOLDEN.find(g => g.id === d.startgp).dominio.split(' ')[0]; return go('nova'); }
  if (d.chip) return answerChip(d.chip);
  if (d.skill) { S.g0.skills = d.skill; return render(); }
  if (d.sc) { S.run.scenario = d.sc; return render(); }
  if (d.dec) return decide(d.dec);
  if (d.score) { const [id, c, n] = d.score.split('|'); S.blindScores[id] = { ...(S.blindScores[id] || {}), [c]: +n }; return render(); }
  if (d.sp) { const [id, a] = d.sp.split('|'); S.sponsorDone[id] = a; if (S.j && id === S.j.id) addEvent('G3', a === 'aprovar' ? 'Sponsor aprovou piloto em uma regional.' : 'Sponsor pediu mais informações antes do piloto.', a === 'aprovar' ? 'ok' : 'warn'); toast(a === 'aprovar' ? 'Piloto aprovado' : 'Pedido de informações enviado ao solicitante'); return render(); }
  ACTIONS[d.a] && ACTIONS[d.a](t);
});

const ACTIONS = {

    const base = freshState();
    Object.assign(S, { chat: [], chatStep: 0, typing: false, ficha: {}, fichaHl: [], fichaApproved: false, g0: base.g0, run: base.run, decision: null });
    CHAT[0].chips = [['Reduzir em pelo menos 40% o volume de alertas tratados', 'good'], ['Reduzir o ruído o máximo possível', 'vague']];
    S.exps = S.exps.filter(x => x.id !== DEMO_ID && x.id !== 'EXP-VOC-CORR-03');
    S.j = { id: DEMO_ID, titulo: 'Correlação de alarmes da infraestrutura de vídeo', stage: 'ficha' };
    S.exps.unshift({ id: DEMO_ID, titulo: S.j.titulo, dominio: S.idea.dominio, gp: S.idea.gp, sol: 'Ana Ribeiro', fase: -1, st: 'run', stl: 'Ficha em elaboração', gate: '—', upd: 'agora' });
    Object.assign(S.ficha, { id: DEMO_ID, titulo: S.j.titulo, solicitante: 'Ana Ribeiro / Engenharia de Rede', gp: S.idea.gp });
    S.fichaHl = ['id', 'titulo', 'solicitante', 'golden_path'];
    S.chat.push({ me: true, html: esc(S.idea.texto) });
    addEvent('—', 'Ideia registrada no portal. Agente Cientista iniciou a elaboração da ficha.', 'run');
    tourDone('nova');
    go('ficha'); botSay(0);
  },
  approveFicha() {
    S.fichaApproved = true; S.j.stage = 'g0'; updJ(0, 'warn', 'Prontidão G0', 'G0');
    addEvent('G0', 'Ficha aprovada pela solicitante e pelo curador. Verificação de prontidão iniciada.', 'run');
    tourDone('ficha'); toast('Ficha aprovada. O Cientista iniciou a verificação de prontidão.'); go('g0');
  },
  reqInv() { S.g0.dados = 'solicitado'; addEvent('G0', 'Plano de habilitação: inventário de topologia solicitado ao time de Rede (REQ-48213).', 'warn'); toast('Chamado REQ-48213 aberto para o time de Rede'); render(); },
  relInv() { S.g0.dados = 'liberado'; toast('Acesso ao inventário liberado'); render(); },
  approveG0() {
    S.g0.approved = true; S.j.stage = 'exec'; updJ(0, 'run', 'Pronto para executar', 'G0');
    addEvent('G0', S.g0.dados === 'liberado' ? 'G0 aprovado: ambiente, skills, dados e perfil atendidos.' : 'G0 aprovado com plano de habilitação para o inventário de topologia.', 'ok');
    tourDone('g0'); go('exec');
  },
  start() { startRun(); },
  pause() { S.run.status = 'paused'; clearTimeout(timer); render(); },
  resume() { S.run.status = 'running'; tick(); },
  speed() { S.run.speed = S.run.speed === 1 ? 3 : 1; render(); },
  rerun() {
    clearTimeout(timer);
    const sc = S.run.scenario; S.run = freshState().run; S.run.scenario = sc; S.decision = null; S.escalations = S.escalations.filter(e => !e.demo);
    S.j.stage = 'exec'; updJ(0, 'run', 'Pronto para executar', 'G0'); const e = S.exps.find(x => x.id === S.j.id); if (e) e.fase = 0;
    render();
  },
  g1replan() { resolveG1('replan'); },
  g1close() { resolveG1('close'); },
  escalate() { escalateKmax(); },
  openReview() { S.persona = 'especialista'; go('revisao'); },
  applyEsc(t) {
    const id = t.dataset.id; const esc_ = S.escalations.find(x => x.id === id);
    if (esc_.demo) { toast('Orientação enviada. Ralph Loop retomado.'); resumeAfterReview(); S.persona = 'solicitante'; go('exec'); return; }
    S.escalations = S.escalations.filter(x => x.id !== id);
    const e = S.exps.find(x => x.id === esc_.exp); if (e) Object.assign(e, { st: 'run', stl: 'Ralph Loop retomado (k=6)', upd: 'agora' });
    S.events.unshift({ ts: now(), gate: 'G2', exp: esc_.exp, txt: 'Especialista orientou correção: ' + esc_.sugestao, st: 'run', fresh: true });
    tourDone('revisao'); toast('Orientação enviada ao Desenvolvedor'); render();
  },
  rejectEsc(t) {
    const id = t.dataset.id; const esc_ = S.escalations.find(x => x.id === id);
    S.escalations = S.escalations.filter(x => x.id !== id);
    if (esc_.demo) { S.run.status = 'closed'; S.run.block = null; S.j.stage = 'concluido'; updJ(4, 'bad', 'Encerrado: inviável no Kmax'); }
    else { const e = S.exps.find(x => x.id === esc_.exp); if (e) Object.assign(e, { st: 'bad', stl: 'Encerrado como inviável', upd: 'agora', fase: 7 }); }
    S.events.unshift({ ts: now(), gate: 'G2', exp: esc_.exp, txt: 'Especialista encerrou o caso como inviável; aprendizado registrado.', st: 'bad', fresh: true });
    tourDone('revisao'); toast('Caso encerrado com aprendizado'); render();
  },
  submitBlind(t) { S.blindDone.push(t.dataset.id); tourDone('blind'); toast('Avaliação enviada. A origem é revelada só ao curador.'); render(); },
  asSponsor() { S.persona = 'sponsor'; go('sponsor'); },
  proposeGp() { toast('Proposta enviada ao curador Paulo Mendes'); },
  resetDemo() { clearTimeout(timer); S = freshState(); CHAT[0].chips = [['Reduzir em pelo menos 40% o volume de alertas tratados', 'good'], ['Reduzir o ruído o máximo possível', 'vague']]; toast('Demo reiniciada'); go('home'); },
  toggleTheme() { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; },
};

/* boot */
(function () {
  const h = (location.hash || '').slice(1);
  if (['home', 'nova', 'catalogo', 'patterns', 'governanca', 'revisao', 'sponsor'].includes(h)) S.view = h;
  render();
})();
</script>
