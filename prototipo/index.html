<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>METAEXP Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de tela única. Topo com abas (Conversa · Bancada · Experimentos). Conversa = chat central sobre papel quadriculado + painel da ficha à direita. Bancada = trilho de etapas + linha do tempo dos agentes. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --surface-2: #EFF1F4; --surface-3: #E7EAEE; --line: #E1E4E9; --line-strong: #CBD0D8;
  --fg: #12151A; --muted: #59616D; --faint: #8F96A1; --grid: rgba(18, 21, 26, .055);
  --accent: #E1251B; --accent-ink: #FFFFFF; --accent-soft: #FDEBE9; --accent-line: #F6C2BE;
  --a-cientista: #E1251B; --a-dados: #0B8A7C; --a-dev: #4148D8; --a-qa: #C9620A; --a-analista: #7652E8;
  --ok: #138A4F; --ok-soft: #E3F4EA; --warn: #A3640A; --warn-soft: #FBF0DB; --info: #2F5FD0; --info-soft: #E6EDFC;
  --shadow-sm: 0 1px 2px rgba(18,21,26,.06);
  --shadow: 0 1px 2px rgba(18,21,26,.05), 0 10px 30px -12px rgba(18,21,26,.18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1114; --surface: #171A1F; --surface-2: #1E2228; --surface-3: #262B32; --line: #2A2F37; --line-strong: #3A404A;
  --fg: #EEF0F3; --muted: #A4ABB6; --faint: #6F7682; --grid: rgba(238, 240, 243, .045);
  --accent: #FF5147; --accent-ink: #1A0806; --accent-soft: #3A1714; --accent-line: #6E2620;
  --a-cientista: #FF5147; --a-dados: #2CC2B0; --a-dev: #8A90FF; --a-qa: #F2A14B; --a-analista: #A68BFF;
  --ok: #4CCB88; --ok-soft: #13301F; --warn: #E9B44F; --warn-soft: #33280E; --info: #7FA6FF; --info-soft: #16233D;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1114; --surface: #171A1F; --surface-2: #1E2228; --surface-3: #262B32; --line: #2A2F37; --line-strong: #3A404A;
  --fg: #EEF0F3; --muted: #A4ABB6; --faint: #6F7682; --grid: rgba(238, 240, 243, .045);
  --accent: #FF5147; --accent-ink: #1A0806; --accent-soft: #3A1714; --accent-line: #6E2620;
  --a-cientista: #FF5147; --a-dados: #2CC2B0; --a-dev: #8A90FF; --a-qa: #F2A14B; --a-analista: #A68BFF;
  --ok: #4CCB88; --ok-soft: #13301F; --warn: #E9B44F; --warn-soft: #33280E; --info: #7FA6FF; --info-soft: #16233D;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--f-mono); }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- App shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo-mark svg { width: 19px; height: 19px; stroke-width: 2; }
.logo b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.logo small { font-size: 11.5px; color: var(--muted); display: block; line-height: 1.2; }
.mode { font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); vertical-align: 3px; margin-left: 4px; }
.mode.live { background: var(--ok-soft); color: var(--ok); }
.live-input { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.live-input input { flex: 1; min-width: 200px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; background: var(--surface); }
.sim-note { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 8px; width: max-content; max-width: 100%; }
.err-note { font-size: 13px; color: var(--accent); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 11px; margin-left: 8px; }
.tab { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover:not([disabled]) { color: var(--fg); }
.tab.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.tab[disabled] { opacity: .45; cursor: not-allowed; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-strong); }
.icon-btn.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.me { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
.view { min-height: 0; height: 100%; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- Conversa ---------- */
.conv { display: grid; grid-template-columns: minmax(0, 1fr) 372px; height: 100%; min-height: 0; }
.chat-col { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.thread { overflow-y: auto; padding: 28px 20px 16px; }
.thread-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.intro { text-align: center; padding: 28px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.intro .big-av { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 12px 30px -10px var(--accent); }
.intro .big-av svg { width: 32px; height: 32px; stroke-width: 1.7; }
.intro h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
.intro p { color: var(--muted); max-width: 52ch; }
.lab-tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.lab-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.msg { display: flex; gap: 12px; align-items: flex-start; animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.av { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--surface); }
.av svg { width: 18px; height: 18px; stroke-width: 2; }
.av.cientista { background: var(--a-cientista); } .av.dados { background: var(--a-dados); } .av.dev { background: var(--a-dev); } .av.qa { background: var(--a-qa); } .av.analista { background: var(--a-analista); }
.msg-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.msg-name { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.msg-name span { font-weight: 500; color: var(--faint); font-family: var(--f-mono); font-size: 11px; }
.msg-text { font-size: 15px; line-height: 1.6; max-width: 62ch; }
.msg-text b { font-weight: 700; }
.msg-text .hl { background: var(--accent-soft); color: var(--fg); padding: 0 4px; border-radius: 4px; font-weight: 600; }
.msg.user { flex-direction: row-reverse; }
.msg.user .msg-body { align-items: flex-end; }
.bubble-user { background: var(--fg); color: var(--bg); padding: 10px 15px; border-radius: 18px 18px 4px 18px; max-width: 78%; font-size: 15px; }
.file-bubble { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; border-radius: 14px 14px 4px 14px; box-shadow: var(--shadow-sm); }
.file-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.file-bubble b { display: block; font-size: 14px; } .file-bubble small { color: var(--muted); font-size: 12px; }
.typing { display: inline-flex; gap: 5px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: max-content; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: pulse 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

/* Cards inside chat */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-sm); min-width: 0; animation: rise .4s ease-out; }
.card-label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card h3 { font-size: 18px; font-weight: 650; margin-top: 6px; }
.tech-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.tech { border-radius: 12px; padding: 12px; background: var(--surface-2); }
.tech small { font-size: 11.5px; color: var(--muted); display: block; }
.tech b { font-family: var(--f-display); font-size: 17px; font-weight: 650; display: block; margin-top: 2px; letter-spacing: -0.01em; }
.tech.key { background: var(--accent-soft); }
.tech.key b { color: var(--accent); }
.rag-flow { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.rag-flow span { background: var(--surface); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; color: var(--fg); }
.rag-flow i { font-style: normal; color: var(--faint); }

.ficha-preview { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; cursor: pointer; transition: border-color .15s, transform .15s; }
.ficha-preview:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.ficha-thumb { width: 64px; height: 80px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); padding: 8px 7px; display: flex; flex-direction: column; gap: 4px; }
.ficha-thumb i { display: block; height: 4px; border-radius: 2px; background: var(--line-strong); }
.ficha-thumb i.r { background: var(--accent); width: 60%; }
.ficha-preview p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.link { color: var(--accent); font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 4px; align-items: center; margin-top: 6px; }

.analyzing { display: flex; flex-direction: column; gap: 8px; }
.an-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.an-step .st { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.an-step.run .st { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.an-step.done { color: var(--fg); }
.an-step.done .st { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.an-step.done .st svg { width: 12px; height: 12px; stroke-width: 3; }
@keyframes spin { to { transform: rotate(360deg); } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat small { font-size: 11.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font-family: var(--f-display); font-size: 22px; font-weight: 650; display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .ok { color: var(--ok); } .stat .warn { color: var(--warn); }
.meter { margin-top: 24px; }
.meter-h { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.meter-h b { color: var(--fg); white-space: nowrap; }
.meter-bar { position: relative; height: 10px; border-radius: 99px; background: var(--surface-3); }
.meter-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--a-dados); }
.meter-bar .goal { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); border-radius: 2px; }
.bars { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .track { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--a-dados); border-radius: 99px; }
.bar-row span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.checks { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks .ck { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 2px; }
.checks .ck svg { width: 11px; height: 11px; stroke-width: 3; }
.checks .ck.ok { background: var(--ok-soft); color: var(--ok); }
.checks .ck.warn { background: var(--warn-soft); color: var(--warn); }

.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.skill { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.skill .lv { margin-left: auto; display: flex; gap: 3px; }
.skill .lv i { width: 6px; height: 14px; border-radius: 2px; background: var(--line-strong); }
.skill .lv i.on { background: var(--a-dev); }
.skill b { font-size: 13.5px; display: block; } .skill small { font-size: 12px; color: var(--muted); }
.time-est { display: flex; gap: 16px 24px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.time-est b { color: var(--fg); font-family: var(--f-display); font-size: 16px; }

.handoff { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border-color: var(--accent-line); }
.handoff .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.handoff div.tx { flex: 1; min-width: 200px; }
.handoff p { color: var(--muted); font-size: 13.5px; }

.kit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.kit-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; min-width: 0; }
.kit-item .mono { font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kit-item small { color: var(--muted); font-size: 11.5px; }

/* Composer */
.composer-wrap { padding: 8px 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.composer-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 500; text-align: left; box-shadow: var(--shadow-sm); transition: border-color .15s, background .15s, transform .1s; animation: rise .3s ease-out backwards; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip:active { transform: scale(.98); }
.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.primary:hover { filter: brightness(1.06); background: var(--accent); }
.chip svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--fg); }
.composer textarea { flex: 1; border: 0; outline: 0; background: transparent; resize: none; min-height: 40px; max-height: 140px; padding: 9px 6px; line-height: 1.45; }
.composer textarea:disabled { cursor: not-allowed; }
.composer .attach, .composer .send { width: 40px; height: 40px; border-radius: 12px; border: 0; display: grid; place-items: center; flex: none; }
.composer .attach { background: transparent; color: var(--muted); }
.composer .attach:hover { background: var(--surface-2); color: var(--fg); }
.composer .attach.want { background: var(--accent-soft); color: var(--accent); animation: pulse 1.4s infinite; }
.composer .send { background: var(--fg); color: var(--bg); }
.composer .send:disabled { background: var(--surface-3); color: var(--faint); cursor: not-allowed; }
.composer-note { font-size: 11.5px; color: var(--faint); text-align: center; }

/* Ficha side panel */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel-h h2 { font-size: 19px; font-weight: 650; }
.ver { font-family: var(--f-mono); font-size: 11px; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.progress-bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.f-sec { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; transition: background 1.2s; }
.f-sec.flash { background: var(--accent-soft); transition: none; }
.f-k { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); }
.f-v { font-size: 14px; }
.f-v.empty { color: var(--faint); font-style: italic; }
.f-v .pillx { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); margin: 2px 4px 2px 0; }
.f-v .pillx.red { background: var(--accent-soft); color: var(--accent); }
.f-v .hyp { font-family: var(--f-display); font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
.who { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.who-scale { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--a-analista), var(--a-dev)); }
.who-scale i { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--fg); transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.2,.8,.2,1); }
.who-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.who-guess { font-weight: 700; font-size: 14px; }

async function say(text, cards = '', agent = 'cientista') {
  const t = S.token;
  pushHtml(`<div class="msg"><div class="av ${agent}">${ic(AG[agent].icon)}</div><div class="msg-body"><div class="typing"><i></i><i></i><i></i></div></div></div>`);
  await sleep(650 + Math.min(text.length * 4, 900));

  const words = text.split(' ');
  for (let i = 1; i <= words.length; i += S.fast ? 6 : 2) {
    updateLast(msgHtml(agent, fmt(words.slice(0, i).join(' '))));
    await sleep(28); guard(t);
  }
  updateLast(msgHtml(agent, fmt(text)));
  if (cards) { await sleep(250); guard(t); updateLast(msgHtml(agent, fmt(text), cards)); }
}

/* ---------- roteiro da conversa ---------- */
const isNo = t => /\bn[aã]o\b|nenhum|ainda n/i.test(t);
async function conversation() {
  const t = S.token;
  try {
    await sleep(300);
    await say('Oi, Ana! Sou o **Cientista** do beOn Labs. Para começar: **qual é o problema que você quer resolver?**');
    const a1 = await ask({ chips: [{ label: 'Meus analistas perdem muito tempo procurando respostas na FAQ e nos procedimentos' }, { label: 'Quero usar IA para ajudar o atendimento' }] });
    guard(t);
    if (a1.text.length < 45 || /quero usar ia/i.test(a1.text)) {
      await say('Gosto da ideia, mas IA é o meio, não o problema. **O que acontece hoje que você gostaria que fosse diferente?**');
      await ask({ chips: [{ label: 'Os analistas demoram para achar a resposta certa na FAQ durante a ligação' }] });
      guard(t);
    }
    setF({ titulo: 'Busca semântica na FAQ do atendimento', problema: 'Analistas gastam tempo demais procurando respostas na FAQ e nos procedimentos durante o atendimento.' });
    whoSignal(-8, 'Descreveu o problema pelo impacto na operação');

    await say('Entendi. **Quem sente isso no dia a dia e quanto tempo se perde?** Uma estimativa já ajuda.');
    const a2 = await ask({ chips: [{ label: 'Uns 40 analistas, cerca de 2 horas por dia cada um buscando' }, { label: 'Não sei medir com precisão' }] });
    guard(t);
    if (/n[aã]o sei/i.test(a2.text)) {
      await say('Sem problema. Em casos parecidos, analistas gastam **perto de 25% do tempo de ligação buscando informação**. Uso isso como ponto de partida e medimos no teste.');
      setF({ publico: '≈ 40 analistas de atendimento · ~25% do tempo de ligação em busca' });
    } else setF({ publico: '40 analistas de atendimento · ~2 h/dia cada em buscas' });
    whoSignal(-6, 'Pensa em pessoas e tempo, não em sistema');

    await say('E **como você saberia que o experimento deu certo?**');
    let a3 = await ask({ chips: [{ label: 'Se eles encontrassem as respostas mais rápido' }, { label: 'Reduzir em 20% o trabalho de busca dos analistas' }] });
    guard(t);
    const m = a3.text.match(/(\d+)\s*%/);
    if (!m) {
      await say('"Mais rápido" é o caminho, mas preciso de um número para dar um veredito no final. Em casos assim, **20% de redução** é ambicioso e realista. Fechamos em 20%?');
      a3 = await ask({ chips: [{ label: 'Fechado, 20%' }, { label: 'Quero ser mais ambiciosa: 30%' }] });
      guard(t);
      const m2 = a3.text.match(/(\d+)\s*%/); if (m2) S.meta = +m2[1];
    } else S.meta = +m[1];

    await say('Agora tenho clareza. Eu entendi que esse experimento é de **IA generativa**. Você vai usar **RAG**, porque o que resolve o seu problema é uma **pesquisa semântica nos seus dados**: o analista pergunta com as palavras dele e recebe a resposta certa, com a fonte.', techCard());
    setF({ tecnologia: ['IA generativa', 'RAG · busca semântica'], hipotese: `Com busca semântica sobre a FAQ, os analistas reduzem em ${S.meta}% o tempo gasto procurando respostas.`, metricas: [`Tempo de busca −${S.meta}%`, 'Respostas corretas ≥ 85%', 'Resposta com fonte citada'] });
    await sleep(300); guard(t);
    await say(`De acordo com a sua hipótese, você vai ==reduzir o trabalho do seu analista em ${S.meta}%== com essas buscas semânticas. Coloquei tudo na ficha.`, fichaPreview('Ficha do experimento · versão de trabalho', 'Problema, hipótese, tecnologia e métricas. Faltam os dados.'));

    await say('Para montar um RAG, você vai precisar de uma **amostra de dados**: o conteúdo onde a busca vai acontecer. **Você tem dados disponíveis?**');
    const a4 = await ask({ chips: [{ label: 'Sim, tenho uma FAQ' }, { label: 'Ainda não tenho dados' }] });
    guard(t);
    if (isNo(a4.text)) {
      await say('Tudo bem. Sem dados não dá para testar, mas não precisa ser nada sofisticado. **A FAQ que o time já consulta serve**, mesmo que esteja numa planilha ou num documento. Consegue exportar?');
      await ask({ chips: [{ label: 'Consigo, tenho a FAQ numa planilha' }] });
      guard(t);
    }
    setF({ dados: 'FAQ interna do atendimento' });
    await say('Ótimo. **Então coloque a FAQ aqui que eu vou analisar os dados.** Pode arrastar o arquivo para cá ou usar o clipe.');
    await ask({ upload: true, noText: true, chips: [{ label: 'Anexar arquivo', icon: 'clip', primary: true, act: 'upload' }, { label: 'Usar FAQ de exemplo', icon: 'file', file: { name: 'FAQ_atendimento.xlsx', meta: 'Planilha · 84 KB' } }] });
    guard(t);
    await analyze('Analisando amostra', ['Lendo o arquivo', 'Identificando colunas e estrutura', 'Checando duplicadas e respostas vazias', 'Calculando o tamanho mínimo da amostra']);
    S.rows = 230;
    setF({ amostra: '230 pares pergunta-resposta · bem estruturados' });
    await say('Os dados estão **bem estruturados**. Encontrei **230 registros** com pergunta, resposta e categoria. Para medir com confiança, preciso de **pelo menos mais 200**. **Você consegue?**', dataCard(230, 430));
    const a5 = await ask({ chips: [{ label: 'Consigo, tenho mais registros' }, { label: 'Não consigo agora' }] });
    guard(t);
    if (!isNo(a5.text)) {
      await say('Perfeito. **Então mande aqui o restante dos dados.** Preciso de pelo menos mais 200.');
      await ask({ upload: true, noText: true, chips: [{ label: 'Anexar arquivo', icon: 'clip', primary: true, act: 'upload' }, { label: 'Usar complemento de exemplo', icon: 'file', file: { name: 'FAQ_procedimentos_2026.xlsx', meta: 'Planilha · 112 KB' } }] });
      guard(t);
      await analyze('Analisando complemento', ['Lendo o complemento', 'Unindo às 230 perguntas anteriores', 'Removendo 9 duplicadas entre os arquivos']);
      S.rows = 468; S.extra = true;
      setF({ amostra: '468 pares pergunta-resposta · margem ±4 p.p.' });
      await say('Agora sim: **468 registros**, acima do mínimo. Dá para chegar a um resultado confiável.', dataCard(468, 430));
    } else {

function restoreBench() { const el = document.getElementById('tlIn'); if (!el) return; S.benchLog.forEach(h => el.insertAdjacentHTML('beforeend', h.html)); const t = document.getElementById('timeline'); if (t) t.scrollTop = t.scrollHeight; }
function scrollTl() { const t = document.getElementById('timeline'); if (t) t.scrollTo({ top: t.scrollHeight, behavior: 'smooth' }); }
function bPush(html, id) { S.benchLog.push({ html, id }); const el = document.getElementById('tlIn'); if (el) { el.insertAdjacentHTML('beforeend', html); scrollTl(); } }
function bUpdate(id, html) { const it = S.benchLog.find(x => x.id === id); if (it) it.html = html; const el = document.getElementById(id); if (el) el.outerHTML = html; }

async function runBench() {
  const t = S.token; S.bench.started = true;
  try {
    // 1 · Ficha
    stageDivider(0); stage('ficha', 'wait');
    const f = await bAsk('cientista', 'Bem-vinda à bancada, Ana. Antes de começar, **revise a ficha final**. Está tudo ok com ela?', fichaFullCard(), [{ label: 'Está tudo ok', cls: 'red' }, { label: 'Quero ajustar a meta' }]);
    guard(t);
    if (f === 1) {
      const m = await bAsk('cientista', 'Claro. **Qual meta de redução faz mais sentido para você?**', '', [{ label: '15%' }, { label: '20%' }, { label: '25%' }]);
      guard(t); S.meta = [15, 20, 25][m];
      setF({ hipotese: `Com busca semântica sobre a FAQ, os analistas reduzem em ${S.meta}% o tempo gasto procurando respostas.`, metricas: [`Tempo de busca −${S.meta}%`, 'Respostas corretas ≥ 85%', 'Resposta com fonte citada'] });
      await bSay('cientista', `Ficha atualizada para **−${S.meta}%** e aprovada. Seguindo.`);
    }
    stage('ficha', 'ok');

    // 2 · Amostra
    stageDivider(1); stage('amostra', 'wait');
    const txt = 'Olá! Sou o Analista de Dados. **Conferi a amostra aqui** e estas são as análises primárias. Por enquanto **está tudo ok. Posso dar o próximo passo?**';
    const a = await bAsk('dados', txt, sampleCard(), [{ label: 'Pode seguir', cls: 'red' }, { label: 'E as perguntas sem resposta?' }]);
    guard(t);
    if (a === 1) {
      await bAsk('dados', 'As **6 perguntas sem resposta** ficam fora do teste e vão num relatório para o time que mantém a FAQ. Elas não afetam o resultado. Posso seguir?', '', [{ label: 'Pode seguir', cls: 'red' }]);
      guard(t);
    }
    stage('amostra', 'ok');

    // 3 · Construção
    stageDivider(2); stage('dev', 'run');
    const steps = ['Limpando a amostra (12 duplicadas removidas)', `Dividindo a FAQ em ${S.rows === 230 ? '612' : '1.140'} trechos pesquisáveis`, 'Gerando embeddings e indexando no banco vetorial', 'Configurando a busca semântica', 'Conectando o modelo de linguagem com citação de fonte'];
    const devTxt = 'Começando a construção do RAG no sandbox do laboratório.';
    const id = await bSay('dev', devTxt, stepsCard('Construção · sandbox exp-atd-rag-01', steps, 0));
    for (let i = 1; i <= steps.length; i++) { await sleep(900); guard(t); bUpdate(id, bMsg(id, 'dev', devTxt, stepsCard('Construção · sandbox exp-atd-rag-01', steps, i))); }
    await bSay('dev', 'Pronto. O assistente de busca está de pé. Passando para o QA testar.');
    stage('dev', 'ok');

    // 4 · Qualidade
    stageDivider(3); stage('qa', 'run');
    const rounds = [
      { q: 61, p: 'Muitas respostas sem citar a fonte. Devolvido ao Desenvolvedor.' },
      { q: 76, p: 'Confundiu planos antigos com os atuais. Ajustada a data de vigência.' },
      { q: 89, p: 'Meta de qualidade de 85% atingida.' },
    ];
    const qaTxt = 'Testando com **120 perguntas reais** feitas pelos analistas na última semana. Cada rodada aponta o que melhorar, e o Desenvolvedor corrige.';
    const qid = await bSay('qa', qaTxt, roundsCard([]));
    for (let i = 1; i <= rounds.length; i++) { await sleep(1300); guard(t); bUpdate(qid, bMsg(qid, 'qa', qaTxt, roundsCard(rounds.slice(0, i)))); scrollTl(); }
    await bSay('qa', 'Aprovado em **3 rodadas**: 89% de respostas corretas e 96% com a fonte citada. Encaminhando ao Analista.');
    stage('qa', 'ok');

    // 5 · Resultado
    stageDivider(4); stage('resultado', 'run');
    await sleep(500); guard(t);
    await bSay('analista', `Terminei a análise, Ana. **Sua hipótese foi confirmada**${S.rows === 230 ? ' de forma indicativa' : ''}. Preparei o resultado completo para você.`, teaserCard());
    stage('resultado', 'ok');
    toast('Resultado do experimento pronto');
  } catch (e) { if (!(e instanceof Abort)) console.error(e); }
}

document.addEventListener('click', e => {
  if (e.target.closest('#send')) return sendTyped();
  if (e.target.closest('#attach')) { if (pending && pending.upload) document.getElementById('fileIn').click(); else toast('O Cientista vai pedir os dados no momento certo'); return; }
  const el = e.target.closest('[data-tab],[data-a],[data-chip],[data-bans],[data-dec],[data-jump]');
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { closeLayer(); return setTab(d.tab); }
  if (d.chip !== undefined) {
    const c = pending && pending.chips[+d.chip]; if (!c) return;
    if (c.act === 'upload') return document.getElementById('fileIn').click();
    if (c.file) return answer({ file: c.file, text: c.file.name });
    return answer({ text: c.label });
  }
  if (d.bans) { const [id, i] = d.bans.split('|'); return bAnswer(id, +i); }
  if (d.dec) {
    S.bench.decision = d.dec;
    const ov = document.querySelector('.overlay'), top = ov ? ov.scrollTop : 0;
    document.getElementById('layer').innerHTML = API.live && S.parecer ? liveReportHtml(true) : reportHtml(true);
    document.querySelector('.overlay').scrollTop = top;
    toast('Decisão registrada'); return;
  }
  if (d.jump !== undefined) { const div = document.querySelector(`.stage-div[data-stage="${d.jump}"]`); if (div) div.scrollIntoView({ behavior: 'smooth', block: 'start' }); else toast('Essa etapa ainda não começou'); return; }
  if (ACTIONS[d.a]) ACTIONS[d.a](e, el);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTyped(); }
  if (e.key === 'Enter' && e.target.matches('[data-a="openFicha"]')) openSheet();
  if (e.key === 'Escape') closeLayer();
});
document.addEventListener('input', e => { if (e.target.id === 'input') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
function fileMeta(f) { const kb = Math.max(1, Math.round(f.size / 1024)); return (f.name.split('.').pop() || 'arquivo').toUpperCase() + ' · ' + (kb > 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB'); }
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';

document.addEventListener('drop', e => {

  const f = e.dataTransfer.files[0]; if (f) answer({ file: { name: f.name, meta: fileMeta(f), blob: f }, text: f.name });
});

const API = { live: false, sid: null, info: null, corpus: null };
const TEC_LABEL = { ia_generativa: 'IA generativa', machine_learning: 'Machine learning', estatistica: 'Estatística', visao_computacional: 'Visão computacional', automacao: 'Automação', otimizacao: 'Otimização', outro: 'Outra' };
const ETAPA_FRONT = { ficha: 'ficha', amostra: 'amostra', construcao: 'dev', qualidade: 'qa', resultado: 'resultado' };
const CARD_AGENTE = { ficha: 'cientista', amostra: 'dados', plano: 'dev', rodada: 'qa', parecer: 'analista' };
const txt = s => fmt(esc(s || ''));

async function sseRead(url, body, onEvent) {
  const t = S.token;
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!r.ok) {
    let msg = r.status + '';
    try { msg = (await r.json()).detail || msg; } catch (e) { /* corpo não-JSON */ }
    throw new Error(msg);
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (t !== S.token) { reader.cancel(); throw new Abort(); }
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split('\n').find(l => l.startsWith('data: '));
      if (line) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

function mapFicha(f) {
  return {
    id: f.id || S.F.id, v: (S.F.v || 0) + 1, titulo: f.titulo,
    problema: f.problema, publico: f.publico_afetado, hipotese: f.hipotese,
    tecnologia: f.tecnologia ? [TEC_LABEL[f.tecnologia] || f.tecnologia, f.tecnica || ''] : undefined,
    metricas: (f.metricas || []).map(m => `${m.descricao} ${m.meta}${m.obrigatoria ? '' : ' (opcional)'}`),
    dados: f.dados, amostra: f.amostra, skills: f.skills && f.skills.length ? f.skills : undefined,
    execucao: f.execucao === 'laboratorio' ? 'Laboratório · workflow de agentes' : f.execucao === 'solicitante' ? 'Solicitante' : undefined,
  };
}
const CAMPO_FRONT = { publico_afetado: 'publico', tecnica: 'tecnologia', justificativa_tecnica: 'tecnologia' };

function applyFichaEvent(ev) {
  S.F = mapFicha(ev.ficha);
  (ev.changed || []).forEach(k => S.changed.add(CAMPO_FRONT[k] || k));
  renderPanel();
}

function exampleCsv() {
  const temas = [['Faturas e cobrança', ['Como pago a fatura pelo app?', 'Pelo app, em Faturas > Pagar, com Pix ou cartão.'], ['Posso parcelar uma fatura atrasada?', 'Sim, em até 6 vezes pela central ou pelo app.']], ['Planos e ofertas', ['Troco de plano no meio do ciclo?', 'Sim, a cobrança é proporcional e aparece na fatura seguinte.']], ['Portabilidade', ['Quanto tempo leva a portabilidade?', 'Até 3 dias úteis após a solicitação.']], ['Suporte técnico', ['Internet lenta, o que verificar?', 'Reinicie o modem e teste pelo app de diagnóstico.']]];
  const linhas = ['pergunta,resposta,categoria,atualizado_em'];
  for (let i = 0; i < 230; i++) {
    const t = temas[i % temas.length], par = t[1 + (i % (t.length - 1))];
    linhas.push(`"${par[0]} (variação ${i + 1})","${par[1]}","${t[0]}","2026-0${1 + (i % 9)}-15"`);
  }
  return new Blob([linhas.join('\n')], { type: 'text/csv' });
}
function toB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}

async function liveTurn(url, body) {
  const t = S.token, out = { chips: [], upload: false, ended: false };
  const parts = [];
  const html = () => parts.map(p => p.t === 'text' ? `<div class="msg-text">${txt(p.s)}</div>` : p.html).join('');
  pushHtml(`<div class="msg"><div class="av cientista">${ic('flask')}</div><div class="msg-body"><div class="typing"><i></i><i></i><i></i></div></div></div>`);
  const draw = () => updateLast(msgHtml('cientista', '', html() || '<div class="typing"><i></i><i></i><i></i></div>'));
  const card = h => { parts.push({ t: 'card', html: h }); draw(); };
  await sseRead(url, body, ev => {
    if (t !== S.token) return;
    if (ev.type === 'text') { const last = parts[parts.length - 1]; if (last && last.t === 'text') last.s += ev.delta; else parts.push({ t: 'text', s: ev.delta }); draw(); }
    else if (ev.type === 'retry') { for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t === 'text') parts.splice(i, 1); draw(); }
    else if (ev.type === 'ficha') applyFichaEvent(ev);
    else if (ev.type === 'perfil') { S.who = { score: ev.score, guess: ev.guess, signals: ev.sinais || [] }; renderPanel(); }
    else if (ev.type === 'chips') out.chips = ev.options;
    else if (ev.type === 'upload') out.upload = true;
    else if (ev.type === 'card') {
      if (ev.kind === 'tecnologia') card(liveTechCard(ev.data));
      else if (ev.kind === 'amostra') card(liveDataCard(ev.data));
      else if (ev.kind === 'skills') card(liveSkillsCard(ev.data));
      else if (ev.kind === 'similares') card(liveSimilaresCard(ev.data));
    }
    else if (ev.type === 'handoff') {
      out.ended = true;
      S.path = ev.destino === 'workflow' ? 'negocio' : 'dev';
      card(ev.destino === 'workflow' ? handoffCard() : liveDevCard(ev.ficha));
      renderTabs();
    }
    else if (ev.type === 'error') card(`<div class="err-note">${esc(ev.message)}</div>`);
  });
  if (!parts.length) draw();
  return out;
}

async function liveConversation() {
  const t = S.token;
  try {
    const r = await fetch('/api/sessoes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: 'Ana' }) });
    const st = await r.json(); guard(t);
    API.sid = st.id; S.F.id = st.ficha.id; renderPanel();
    let next = await liveTurn(`/api/sessoes/${API.sid}/iniciar`, {});
    for (;;) {
      guard(t);
      if (next.ended) { pending = null; renderComposer(); return; }
      const chips = next.chips.map(l => ({ label: l }));
      const opts = { chips };
      if (next.upload) {
        opts.upload = true;
        opts.chips = [{ label: 'Anexar arquivo', icon: 'clip', primary: true, act: 'upload' },
          { label: 'Usar FAQ de exemplo', icon: 'file', file: { name: 'FAQ_atendimento.csv', meta: 'CSV · exemplo com 230 perguntas' } }, ...chips];
      }
      const a = await ask(opts); guard(t);
      if (a.file) {
        const b64 = await toB64(a.file.blob || exampleCsv());
        next = await liveTurn(`/api/sessoes/${API.sid}/arquivos`, { nome: a.file.name, conteudo_base64: b64 });
      } else {
        next = await liveTurn(`/api/sessoes/${API.sid}/mensagens`, { texto: a.text });
      }
    }
  } catch (e) {
    if (e instanceof Abort) return;
    console.error(e);
    pushHtml(msgHtml('cientista', `<span class="err-note">Não consegui falar com o backend: ${esc(e.message)}</span>`));
    pending = { chips: [{ label: 'Tentar de novo', retry: true }], res: () => ACTIONS.restart(), token: S.token };
    renderComposer();
  }
}

/* ---------- bancada ao vivo ---------- */
let roundsMsg = null;
async function liveBench(decisao, comentario) {
  const t = S.token;
  S.bench.started = true;
  S.liveDivs = S.liveDivs || new Set();
  S.liveRounds = S.liveRounds || [];
  try {
    await sseRead(`/api/sessoes/${API.sid}/bancada`, { decisao, comentario }, ev => { if (t === S.token) onBenchEvent(ev); });
  } catch (e) {
    if (!(e instanceof Abort)) bPush(bMsg('b' + (++bSeq), 'cientista', '', `<div class="err-note">Falha na bancada: ${esc(e.message)}</div>`));
  }
}
function onBenchEvent(ev) {
  if (ev.type === 'etapa') {
    const idx = Object.keys(ETAPA_FRONT).indexOf(ev.etapa);
    if (!S.liveDivs.has(idx)) { S.liveDivs.add(idx); stageDivider(idx); }
    stage(ETAPA_FRONT[ev.etapa], ev.status === 'bloqueada' ? 'wait' : ev.status);
    if (ev.etapa === 'resultado' && ev.status === 'ok') toast('Resultado do experimento pronto');
  } else if (ev.type === 'mensagem') {
    bPush(bMsg('b' + (++bSeq), AG[ev.agente] ? ev.agente : 'cientista', esc(ev.texto)));
  } else if (ev.type === 'card') {
    const ag = CARD_AGENTE[ev.kind] || 'cientista';
    if (ev.kind === 'ficha') { S.F = mapFicha(ev.data); bPush(bMsg('b' + (++bSeq), ag, '', fichaFullCard())); }
    else if (ev.kind === 'amostra') bPush(bMsg('b' + (++bSeq), ag, '', liveSampleCard(ev.data)));
    else if (ev.kind === 'plano') bPush(bMsg('b' + (++bSeq), ag, '', livePlanCard(ev.data)));
    else if (ev.kind === 'rodada') {
      S.liveRounds.push(ev.data);
      if (!roundsMsg || !document.getElementById(roundsMsg)) { roundsMsg = 'b' + (++bSeq); bPush(bMsg(roundsMsg, 'qa', '', liveRoundsCard(S.liveRounds)), roundsMsg); }
      else bUpdate(roundsMsg, bMsg(roundsMsg, 'qa', '', liveRoundsCard(S.liveRounds)));
    }
    else if (ev.kind === 'parecer') { S.parecer = ev.data; bPush(bMsg('b' + (++bSeq), ag, '', liveTeaser(ev.data))); }
  } else if (ev.type === 'aprovacao') {
    const id = 'b' + (++bSeq);
    const precisaTexto = o => o.id === 'ajustar' || o.id === 'orientar';
    const btns = ev.opcoes.map(o => `<button class="btn ${precisaTexto(o) ? '' : 'red'}" data-lb="${esc(o.id)}" data-msg="${id}">${esc(o.rotulo)}</button>`).join('');
    bPush(`<div class="msg" id="${id}"><div class="av cientista">${ic('flask')}</div><div class="msg-body"><div class="actions">${btns}</div></div></div>`, id);
  } else if (ev.type === 'error') {
    bPush(bMsg('b' + (++bSeq), 'cientista', '', `<div class="err-note">${esc(ev.message)}</div>`));
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if (!b) return;
  const id = b.dataset.msg, op = b.dataset.lb, rotulo = b.textContent;
  if ((op === 'ajustar' || op === 'orientar') && !document.getElementById('lbText')) {
    const box = `<div class="live-input"><input id="lbText" type="text" placeholder="${op === 'ajustar' ? 'O que você quer mudar na ficha?' : 'Orientação para o Desenvolvedor'}" aria-label="Comentário"><button class="btn red" data-lb="${op}" data-msg="${id}">Enviar</button></div>`;
    document.querySelector(`#${id} .msg-body`).insertAdjacentHTML('beforeend', box);
    document.getElementById('lbText').focus();
    return;
  }
  const input = document.getElementById('lbText');
  const comentario = input ? input.value.trim() : null;
  if ((op === 'ajustar' || op === 'orientar') && !comentario) { toast('Escreva o comentário antes de enviar'); return; }
  bUpdate(id, `<div class="msg" id="${id}"><div class="av cientista">${ic('flask')}</div><div class="msg-body"><span class="chosen">${ic('check')}${esc(comentario || rotulo)}</span></div></div>`);
  liveBench(op, comentario);
});

/* ---------- relatório ao vivo ---------- */
const VEREDITO = { validada: ['Hipótese validada', 'ok'], parcialmente_comprovada: ['Hipótese parcialmente comprovada', 'warn'], invalidada: ['Hipótese invalidada', 'bad'], inconclusiva: ['Resultado inconclusivo', 'warn'] };
function liveReportHtml(still) {
  const p = S.parecer, D = S.bench.decision, v = VEREDITO[p.veredito] || [p.veredito, 'warn'];
  const ms = p.resultados.metricas || [], m0 = ms[0];
  const tagStyle = v[1] === 'ok' ? '' : 'background:var(--warn-soft);color:var(--warn)';
  const lista = xs => `<ul>${(xs || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul>`;
  return `<div class="overlay ${still ? 'still' : ''}" data-a="closeOverlay"><article class="report" role="dialog" aria-label="Resultado do experimento">
    <div class="rep-top">${ic('flask')}<span class="mono">${esc(S.F.id)} · resultado do experimento</span><span class="sp"></span><button class="icon-btn" data-a="closeLayer" aria-label="Fechar">${ic('x')}</button></div>
    <section class="rep-hero"><div><span class="verdict-tag" style="${tagStyle}">${ic(v[1] === 'ok' ? 'check' : 'x')}${esc(v[0])}</span>
      <h1>${esc(p.titulo)}</h1><p class="sub">${esc(p.resumo)}</p>
      ${p.resultados.simulado ? '<p class="sim-note" style="margin-top:12px">Resultados gerados pelo executor simulado, não medidos.</p>' : ''}</div>
      <div class="hero-num"><div class="n" style="font-size:${m0 && m0.resultado.length > 6 ? 56 : 96}px">${esc(m0 ? m0.resultado : '—')}</div><p>${esc(m0 ? m0.metrica : '')}</p>${m0 ? `<span class="goal">meta: ${esc(m0.meta)}</span>` : ''}</div></section>
    <div class="rep-body">
      <section class="rep-sec"><h3>Metas da ficha × resultados</h3><div class="tiles">${ms.map(m => `<div class="tile"><small>${esc(m.metrica)}</small><b>${esc(m.resultado)}</b><span style="color:var(--${m.atendida ? 'ok' : 'warn'})">${m.atendida ? 'atendida' : 'não atendida'} · meta ${esc(m.meta)}</span></div>`).join('')}</div></section>
      <section class="two"><div class="rep-sec"><h3>Evidências</h3>${lista(p.evidencias)}</div><div class="rep-sec"><h3>Pontos de atenção</h3>${lista(p.riscos)}</div></section>
      <section class="two"><div class="rep-sec"><h3>Próximos passos</h3>${lista(p.proximos_passos)}</div><div class="rep-sec"><h3>Oportunidades</h3>${lista(p.oportunidades)}</div></section>
      <section class="decide"><div><h3 style="font-size:18px">O que você quer fazer agora?</h3><p style="color:var(--muted);font-size:14px;margin-top:2px">Sua decisão vai para o sponsor e fica registrada no histórico do laboratório.</p></div>
        <div class="decide-opts">${[['piloto', 'Quero um piloto', 'Encaminha ao sponsor'], ['ciclo', 'Rodar nova versão', 'Mais dados ou ajustes'], ['encerrar', 'Encerrar e registrar', 'O aprendizado fica no histórico']].map(o => `<button class="opt ${D === o[0] ? 'on' : ''}" data-dec="${o[0]}"><b>${D === o[0] ? '✓ ' : ''}${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div></section>
    </div></article></div>`;
}

/* início: detecta o backend e escolhe o modo */
(async () => {
  if (/^https?:$/.test(location.protocol)) try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 1500);
    const r = await fetch('/api/health', { signal: ctrl.signal, cache: 'no-store' });
    const j = r.ok ? await r.json() : null;
    if (j && j.ok === true && j.modelo) { API.live = true; API.info = j; }
  } catch (e) { /* sem backend: modo demonstração */ }
  const m = document.getElementById('mode');
  if (API.live) {
    m.textContent = 'LLM ao vivo'; m.classList.add('live'); m.title = `${API.info.modelo} · corpus com ${API.info.corpus.total} experimentos`;
    try { API.corpus = (await (await fetch('/api/experimentos')).json()).corpus; } catch (e) { /* lista opcional */ }
  }
  setTab('conversa');
  if (API.live) liveConversation(); else conversation();
})();

</script>

</body>
</html>
